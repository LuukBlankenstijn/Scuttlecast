name: release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - run: rustup toolchain install stable --profile minimal
      - name: The release tag names the version being published
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [[ "$tag" != "$version" ]]; then
            echo "release $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi

      - run: cargo test --workspace --locked

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish proto, then the library, then the binary
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
