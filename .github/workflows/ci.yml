name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: rustup toolchain install stable --profile minimal

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - run: cargo test --workspace --locked

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: rustup toolchain install stable --profile minimal

      - name: Every crate has the metadata crates.io requires
        run: cargo package --workspace --locked

  netem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: rustup toolchain install stable --profile minimal

      - run: cargo build --release -p scuttlecast-cli --locked

      - name: Transfer through a lossy network
        run: |
          for loss in 1 10; do
            sudo SCUTTLE=target/release/scuttle ./scripts/netem-transfer.sh "$loss" 3 8
          done
