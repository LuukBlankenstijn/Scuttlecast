[package]
name = "scuttlecast-cli"
description = "Command line tool for reliable file and stream transfer over UDP multicast, installs as `scuttle`"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["multicast", "udp", "transfer", "imaging", "cli"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "scuttle"
path = "src/main.rs"

[dependencies]
scuttlecast.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
] }
