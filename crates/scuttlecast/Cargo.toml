[package]
name = "scuttlecast"
description = "Reliable one-to-many file and stream transfer over UDP multicast, with adaptive forward error correction and per-receiver bottleneck reporting"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["multicast", "udp", "transfer", "fec", "reliable"]
categories = ["network-programming"]

[dependencies]
proto.workspace = true
async-stream.workspace = true
derive_more = { workspace = true, features = ["constructor"] }
futures-core.workspace = true
futures-util.workspace = true
rand.workspace = true
socket2.workspace = true
thiserror.workspace = true
bon.workspace = true
tracing.workspace = true
bytes.workspace = true
reed-solomon-erasure.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-std",
    "io-util",
    "net",
    "sync",
    "time",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
